openapi: 3.0.1
info:
  title: Withdrawal
  description: |-
    The _Withdrawal REST API_ provides operations for submitting withdrawal requests from customers.

    ## Changelog

    ### Version 1.1.0
    * Updated error handling to provide more specific error messages and status codes for different failure scenarios
    * Updated the API documentation to include additional details about the withdrawal process and errors

    ### Version 1.0.0
    * Initial version of the Withdrawal REST API
  version: 1.1.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: Withdrawal
    description: This section covers operations for managing withdrawal requests.
    x-origin-class: com.intershop.sellside.rest.withdrawal.v1.capi.resource.WithdrawalItemResource
paths:
  /withdrawals:
    post:
      tags:
        - Withdrawal
      summary: Creates a new withdrawal request
      description: This operation creates a new withdrawal request for the specified order.
      operationId: createWithdrawal
      requestBody:
        description: The withdrawal request to create. The orderDocumentNumber and orderEmail are mandatory.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalDataRO"
        required: true
      responses:
        "201":
          description: Created - The withdrawal request was successfully created.
          content:
            application/vnd.intershop.withdrawal.v1+json:
              schema:
                $ref: "#/components/schemas/WithdrawalResponse"
        "400":
          description: Bad Request - The request was invalid.
        "401":
          description: Unauthorized - Authentication information is missing or invalid.
        "409":
          description: Conflict - The order has already been withdrawn.
        "422":
          description: Unprocessable Entity - The order cannot be withdrawn.
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.withdrawal.v1.capi.resource.WithdrawalListResource.createWithdrawal(com.intershop.sellside.rest.withdrawal.v1.capi.resourceobject.WithdrawalDataRO)
      x-origin-class: com.intershop.sellside.rest.withdrawal.v1.capi.resource.WithdrawalListResource
      x-AuthorizationRule: "[isAnyUser]"
  /withdrawals/{withdrawalKey}:
    patch:
      tags:
        - Withdrawal
      summary: Updates an existing withdrawal request
      description: This operation updates the customer's personal data and status of an existing withdrawal request.
      operationId: updateWithdrawal
      parameters:
        - name: withdrawalKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.withdrawal.v1.capi.resource.WithdrawalListResource
      requestBody:
        description: The withdrawal request data to apply. The name is mandatory.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalDataRO"
        required: true
      responses:
        "200":
          description: OK - The withdrawal request was successfully updated.
          content:
            application/vnd.intershop.withdrawal.v1+json:
              schema:
                $ref: "#/components/schemas/WithdrawalResponse"
        "400":
          description: Bad Request - The request was invalid.
        "401":
          description: Unauthorized - Authentication information is missing or invalid.
        "404":
          description: Not Found - The withdrawal request does not exist.
        "409":
          description: Conflict - The withdrawal request has already been processed.
        "422":
          description: Unprocessable Entity - The withdrawal request cannot be updated.
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.withdrawal.v1.capi.resource.WithdrawalItemResource.updateWithdrawal(com.intershop.sellside.rest.withdrawal.v1.capi.resourceobject.WithdrawalPatchRO)
      x-origin-class: com.intershop.sellside.rest.withdrawal.v1.capi.resource.WithdrawalItemResource
      x-AuthorizationRule: "[]"
components:
  schemas:
    FeedbackCauseRO_v1:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        parameters:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
        paths:
          type: array
          externalDocs:
            url: https://github.com/json-path/JsonPath
          items:
            type: string
    FeedbackRO_v1:
      required:
        - code
        - message
      type: object
      properties:
        causes:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackCauseRO_v1"
        code:
          type: string
        level:
          type: string
          enum:
            - INFO
            - WARN
            - ERROR
        message:
          type: string
        parameters:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
        paths:
          type: array
          externalDocs:
            url: https://github.com/json-path/JsonPath
          items:
            type: string
        status:
          type: string
      description: List of messages regarding the request (e.g., value adjustments)
      readOnly: true
    WithdrawalDataRO:
      type: object
      properties:
        confirmationEmail:
          type: string
          description: The e-mail address of the requesting customer
          example: john.doe@example.com
        name:
          type: string
          description: The name of an element
          example: John Doe
        orderDocumentNumber:
          type: string
          description: The order document number associated with this withdrawal request
          example: "00001234"
        orderEmail:
          type: string
          description: The e-mail address of the order associated with this withdrawal request
          example: john.doe@example.com
        status:
          type: string
          description: The current status of the withdrawal request
          example: INITIAL
          enum:
            - INITIAL
            - CREATED
            - VERIFIED
        title:
          type: string
          description: The title of the requesting customer
          example: Mr.
      description: Editable data of a withdrawal request
    WithdrawalInfoRO:
      required:
        - creationDate
        - locale
      type: object
      properties:
        creationDate:
          type: string
          description: The date and time when the withdrawal request was created
          format: date-time
          readOnly: true
          example: 2020-05-23T13:23:45+02:00
        locale:
          type: string
          description: The locale of the requesting customer
          readOnly: true
          example: en_US
      description: Server-managed metadata of a withdrawal request
    WithdrawalPatchRO:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/WithdrawalDataRO"
        declaredKeys:
          type: array
          items:
            type: string
        empty:
          type: boolean
        keys:
          uniqueItems: true
          type: array
          writeOnly: true
          items:
            type: string
    WithdrawalResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/WithdrawalDataRO"
        id:
          type: string
          description: The ID of the response object
        info:
          $ref: "#/components/schemas/WithdrawalInfoRO"
        messages:
          type: array
          description: List of messages regarding the request (e.g., value adjustments)
          readOnly: true
          items:
            $ref: "#/components/schemas/FeedbackRO_v1"
      description: Response wrapper for a withdrawal request
