openapi: 3.0.1
info:
  title: Newsletter Subscription (E-Mail Marketing)
  description: The Intershop Newsletter Subscription API contains operations that allow to retrieve, delete and update e-mail marketing subscription information of a recipient.
  version: 1.0.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: Subscription (E-Mail Marketing)
    description: "The following operations for managing e-mail marketing subscriptions are available:"
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionResource
paths:
  /subscriptions:
    post:
      tags:
        - Subscription (E-Mail Marketing)
      summary: Subscribes a recipient
      description: This operation subscribes a recipient (represented by an e-mail address in the request body) to the e-mail marketing provider specified for the application.
      operationId: subscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/SubscriptionRO"
      responses:
        "201":
          description: Created - The user was successfully subscribed.
        "400":
          description: |-
            Bad request - The recipient is empty or invalid.
             Possible values for header error-key:
             - subscriptions.recipient.invalid.error
             - subscriptions.recipient.missing.error
        "404":
          description: |-
            Not found - Currently there is no provider for subscription handling available.
             Possible values for header error-key:
             - subscriptions.provider_not_found.error
        "409":
          description: |-
            Conflict - The recipient is already subscribed.
             Possible values for header error-key:
             - subscriptions.recipient.missing.error
        "500":
          description: |-
            Internal Server Error - An error occured during user mail lookup or while converting data.
             Possible values for header error-key:
             - subscriptions.external_service.error
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionsResource.subscribe(com.intershop.sellside.rest.common.capi.resourceobject.subscription.SubscriptionRO)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionsResource
      x-AuthorizationRule: "[isAnyUser]"
  /subscriptions/{SubscriptionResourceKey}:
    get:
      tags:
        - Subscription (E-Mail Marketing)
      summary: Returns subscription status for given recipient
      description: |-
        This operation returns the subscription status of a given recipient based on the account data.
        Only users with an account can access their subscription status using this REST resource.

        This URI can only be accessed with an authentication header. If a valid e-mail address is used as sub resource name, e. g., /subscriptions/patricia@test.intershop.de, this e-mail address is checked for subscription entries in the subscription's provider.

        If the sub resource is "-", e. g., /subscriptions/-, then the e-mail address of the authenticated user is applied.

        The response status codes will be 200 OK, if the recipient is subscribed, or 404 Not Found, if they are not.

        This resource depends on back office configuration for e-mail marketing provider. If no such provider is configured, it will respond with 404 Not Found.
      operationId: getStatus
      parameters:
        - name: SubscriptionResourceKey
          in: path
          description: The recipient's e-mail address or "-" for an authenticated user
          required: true
          schema:
            type: string
            description: The recipient's e-mail address or "-" for an authenticated user
            example: d.weiers@test.intershop.de
          example: d.weiers@test.intershop.de
          x-item-key: com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionsResource
      responses:
        "200":
          description: OK - The subscription for the given user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/SubscriptionRO"
        "404":
          description: |-
            Not found - The user is not subscribed.
             Possible values for header error-key:
             - subscriptions.subscription_not_found.error
        "500":
          description: |-
            Internal Server Error - An error occured during user mail lookup.
             Possible values for header error-key:
             - subscriptions.external_service.error
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.subscription.SubscriptionRO com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionResource.getStatus()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionResource
      x-AuthorizationRule: "[isAuthenticated[Organization]]"
    delete:
      tags:
        - Subscription (E-Mail Marketing)
      summary: Unsubscribes recipient from e-mail provider
      description: |-
        This operation unsubscribes a recipient from an e-mail provider based on the account data.
        Users without an account must use the provided contact information to unsubscribe.

        This URI can only be accessed with an authentication header. If a valid e-mail address is used as sub resource name, e. g., /subscriptions/patricia@test.intershop.de, this e-mail address is checked for subscription entries in the subscription's provider.

        If the sub resource is "-", e. g., /subscriptions/-, then the e-mail address of the authenticated user is applied.

        The response status codes will be 200 OK, if the recipient is subscribed, or 404 Not Found, if they are not.

        This resource depends on back office configuration for e-mail marketing provider. If no such provider is configured, it will respond with 404 Not Found.
      operationId: unsubscribe
      parameters:
        - name: SubscriptionResourceKey
          in: path
          description: The recipient's e-mail address or "-" for an authenticated user
          required: true
          schema:
            type: string
            description: The recipient's e-mail address or "-" for an authenticated user
            example: d.weiers@test.intershop.de
          example: d.weiers@test.intershop.de
          x-item-key: com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionsResource
      responses:
        "204":
          description: No content - The user was successfully unsubscribed.
        "404":
          description: |-
            Not found - The user is not subscribed.
             Possible values for header error-key:
             - subscriptions.subscription_not_found.error
        "500":
          description: |-
            Internal Server Error - An error occured during user mail lookup.
             Possible values for header error-key:
             - subscriptions.external_service.error
      security:
        - bearerAuth: []
      x-origin-method: public void com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionResource.unsubscribe()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.subscription.SubscriptionResource
      x-AuthorizationRule: "[isAuthenticated[Organization]]"
