            - alternate
            - appendix
            - archives
            - author
            - bookmark
            - canonical
            - chapter
            - collection
            - contents
            - copyright
            - create-form
            - current
            - describedby
            - describes
            - disclosure
            - duplicate
            - edit
            - edit-form
            - edit-media
            - enclosure
            - first
            - glossary
            - help
            - hosts
            - hub
            - icon
            - index
            - item
            - last
            - latest-version
            - license
            - lrdd
            - monitor
            - monitor-group
            - next
            - next-archive
            - nofollow
            - noreferrer
            - payment
            - predecessor-version
            - prefetch
            - prev
            - preview
            - previous
            - prev-archive
            - privacy-policy
            - profile
            - related
            - replies
            - search
            - section
            - self
            - service
            - start
            - stylesheet
            - subsection
            - successor-version
            - tag
            - terms-of-service
            - type
            - up
            - version-history
            - via
            - working-copy
            - working-copy-of
        title:
          type: string
          description: The title of the link
        type:
          type: string
          description: "This is a constant: **Link**"
          readOnly: true
          example: Link
          xml:
            attribute: true
        uri:
          type: string
          description: The URI
      description: A Link pointing to a resource
      xml:
        name: Link
    OrderRecommendationEventRO:
      type: object
      xml:
        name: OrderRecommendationEvent
      allOf:
        - $ref: "#/components/schemas/RecommendationEventRO"
        - type: object
          properties:
            items:
              type: array
              xml:
                name: OrderedItems
                wrapped: true
              items:
                $ref: "#/components/schemas/BasketLineItemRO"
            orderID:
              type: string
    ProductViewRecommendationEventRO:
      type: object
      xml:
        name: ProductViewRecommendationEvent
      allOf:
        - $ref: "#/components/schemas/RecommendationEventRO"
        - type: object
          properties:
            productID:
              type: string
    RecommendationEventRO:
      type: object
      properties:
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          readOnly: true
          xml:
            attribute: true
      xml:
        name: RecommendationEvent
      discriminator:
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/ProductViewRecommendationEventRO"
        - $ref: "#/components/schemas/BasketRecommendationEventRO"
        - $ref: "#/components/schemas/OrderRecommendationEventRO"
        - $ref: "#/components/schemas/SearchRecommendationEventRO"
        - $ref: "#/components/schemas/UserRecommendationEventRO"
    ResourceAttribute:
