          description: The pageable offset
          format: int32
        pageable:
          type: string
          description: The pageable ID
        sortKeys:
          uniqueItems: true
          type: array
          description: The keys to sort for
          xml:
            wrapped: true
          items:
            type: string
            description: The keys to sort for
            xml:
              name: sortKey
        total:
          type: integer
          description: The pageable amount total
          format: int32
        type:
          type: string
          description: "This is a constant: **ResourceCollection**"
          example: ResourceCollection
          xml:
            attribute: true
      description: A list of elements
      xml:
        name: ResourceCollection
    SearchRecommendationEventRO:
      type: object
      xml:
        name: SearchRecommendationEvent
      allOf:
        - $ref: "#/components/schemas/RecommendationEventRO"
        - type: object
          properties:
            searchTerm:
              type: string
    UserRecommendationEventRO:
      type: object
      xml:
        name: UserRecommendationEvent
