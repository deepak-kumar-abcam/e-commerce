        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        productID:
          type: string
        quantity:
          type: integer
          format: int32
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          readOnly: true
          xml:
            attribute: true
      xml:
        name: BasketLineItem
    BasketRecommendationEventRO:
      type: object
      xml:
        name: BasketRecommendationEvent
      allOf:
        - $ref: "#/components/schemas/RecommendationEventRO"
        - type: object
