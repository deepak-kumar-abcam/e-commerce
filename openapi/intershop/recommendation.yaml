openapi: 3.0.1
info:
  title: Recommendation
  description: |-
    The Recommendation REST API contains operations that allow to improve the online shopping experience by offering personalized product suggestions to customers. Recommendations are based on user behavior and product relationships, and they can be used in various contexts within your online shop. Using this REST API requires a configured recommendation engine.

    For more details, see [Overview - Recommendation](https://support.intershop.com/kb/index.php/Display/2Y7872) in the Intershop Knowledge Base.


    ## Changelog
    - - -
    ### Version 1.1.0
    * Added this changelog
    * Corrected wrong status codes
    * Minor documentation changes (recommendationcontexts, events)
  version: 1.1.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
paths:
  /recommendationcontexts:
    post:
      tags:
        - Recommendation
      summary: Creates a new recommendation context
      description: This operation creates a new recommendation context. A recommendation context is just a simple string that is used as a replacement for the session ID. All events that are created for a recommendation context via REST are tagged with this context ID when they are transmitted to the connected recommendation engine. It has no semantic meaning to the recommendation engine, it just symbolizes that events with the same ID belong to the same session. This is necessary to ensure a valid data basis.
      operationId: createContext
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LinkRO"
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource.createContext()
      x-origin-class: com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource
      x-AuthorizationRule: "[isAnyUser]"
  /recommendationcontexts/{RecommendationContextKey}/basketrecommendations:
    get:
      tags:
        - Recommendation Request
      summary: Returns recommended products for the given basket
      description: This operation returns a list of recommended products for the given basket based on the basketID. This requires a configured recommendation service. The resulting list strongly depends on the configuration of the recommendation engine and on the back office preferences of the channel (Preferences | Recommendation Engines). If the request type BasketRecommendationRequest is not enabled, an empty list is returned.
      operationId: getBasketRecommendations
      parameters:
        - name: basketID
          in: query
          description: The UUID of the basket to get recommendations for
          schema:
            type: string
            description: The UUID of the basket to get recommendations for
            example: 56z8zttzCtzgtzAAAF1ut8DHYjo
          example: 56z8zttzCtzgtzAAAF1ut8DHYjo
        - name: RecommendationContextKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
        "400":
          description: Bad Request - Missing parameter
        "404":
          description: Not found
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.component.recommendation.capi.rest.resource.BasketRequestRecommendationsListResource.getBasketRecommendations(java.lang.String)
      x-origin-class: com.intershop.component.recommendation.capi.rest.resource.BasketRequestRecommendationsListResource
      x-AuthorizationRule: "[isAnyUser]"
  /recommendationcontexts/{RecommendationContextKey}/events:
    post:
      tags:
        - Recommendation Event
      summary: Creates a new recommendation context
      description: |-
        This operation creates a new recommendation context. This requires a configured recommendation service. To use this operation, specify one of the following events in the request body:
        - ProductViewRecommendationEvent - The product with the given productID [SKU] that has been viewed.
        - BasketRecommendationEvent - The items that have been added to the basket.
        - OrderRecommendationEvent - The items that were ordered or the order with the specified orderID that was submitted.
        - SearchRecommendationEvent - A search with the given searchTerm that has been processed.
        - UserRecommendationEvent - Connects the current recommendation context with the given userID. This event may affect the results of the recommendation requests.

        The event can only be sent successfully if the installed recommendation engines support the event type and if the corresponding back office preferences of the channel (Preferences | Recommendation Engines) are enabled for the given event type.

        All events which are sent to the recommendation engine will be tagged with the RecommendationContextKey to express that they belong to a specific session. See the description of "POST /recommendationcontexts".
      operationId: sendEvent
      parameters:
        - name: RecommendationContextKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationEventRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/RecommendationEventRO"
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request - Unknown event type
        "404":
          description: Not found
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.component.recommendation.capi.rest.resource.EventRecommendationsListResource.sendEvent(com.intershop.component.recommendation.capi.rest.resourceobject.RecommendationEventRO)
      x-origin-class: com.intershop.component.recommendation.capi.rest.resource.EventRecommendationsListResource
      x-AuthorizationRule: "[isAnyUser]"
  /recommendationcontexts/{RecommendationContextKey}/productrecommendations:
    get:
      tags:
        - Recommendation Request
      summary: Returns recommended products for the given product (SKU)
      description: This operation returns a list of recommended products for the given product ID (SKU). This requires a configured recommendation service. The result list strongly depends on the configuration of the recommendation engine and on the back office preferences of the channel (Preferences | Recommendation Engines). If the request type ProductRecommendationRequest is not enabled, an empty list is returned.
      operationId: getProductRecommendations
      parameters:
        - name: productID
          in: query
          description: The SKU of the product to get recommendations for
          schema:
            type: string
            description: The SKU of the product to get recommendations for
            example: "124566"
          example: "124566"
        - name: RecommendationContextKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
        "400":
          description: Bad Request - Missing parameter
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.component.recommendation.capi.rest.resource.ProductRequestRecommendationsListResource.getProductRecommendations(java.lang.String)
      x-origin-class: com.intershop.component.recommendation.capi.rest.resource.ProductRequestRecommendationsListResource
      x-AuthorizationRule: "[isAnyUser]"
  /recommendationcontexts/{RecommendationContextKey}/searchrecommendations:
    get:
      tags:
        - Recommendation Request
      summary: Returns recommended products for the given search term
      description: This operation returns a list of recommended products for the given search term. This requires a configured recommendation service. The result list strongly depends on the configuration of the recommendation engine and on the back office preferences of the channel (Preferences | Recommendation Engines). If the request type SearchRecommendationRequest is not enabled, an empty list is returned.
      operationId: getProductRecommendationsSearchRequest
      parameters:
        - name: searchTerm
          in: query
          description: The search term to get recommendations for
          schema:
            type: string
            description: The search term to get recommendations for
            example: Acer
          example: Acer
        - name: RecommendationContextKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
        "400":
          description: Bad Request - Missing parameter
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.component.recommendation.capi.rest.resource.SearchRequestRecommendationsListResource.getProductRecommendations(java.lang.String)
      x-origin-class: com.intershop.component.recommendation.capi.rest.resource.SearchRequestRecommendationsListResource
      x-AuthorizationRule: "[isAnyUser]"
  /recommendationcontexts/{RecommendationContextKey}/topsellerrecommendations:
    get:
      tags:
        - Recommendation Request
      summary: Returns recommended global top-selling products
      description: This operation returns a list of recommended global top-selling products. This requires a configured recommendation service. The result list strongly depends on the configuration of the recommendation engine and on the back office preferences of the channel (Preferences | Recommendation Engines). If the request type TopsellerRecommendationRequest is not enabled, an empty list is returned.
      operationId: getProductRecommendationsTopsellerRequest
      parameters:
        - name: RecommendationContextKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.component.recommendation.capi.rest.resource.TopsellerRequestRecommendationsListResource.getProductRecommendations()
      x-origin-class: com.intershop.component.recommendation.capi.rest.resource.TopsellerRequestRecommendationsListResource
      x-AuthorizationRule: "[isAnyUser]"
  /recommendationcontexts/{RecommendationContextKey}/userrecommendations:
    get:
      tags:
        - Recommendation Request
      summary: "Returns recommended products for the assigned user / recommendation context  "
      description: This operation returns a list of recommended products for the assigned user. This requires a configured recommendation service. The assignment of a user to the recommendation context must be done separately (see description of POST /recommendationcontexts/{RecommendationContextKey}/events - UserRecommendationEvent). If no user is assigned to the recommendation context, the delivered recommendations are of a general nature and not user-specific. The result list strongly depends on the configuration of the recommendation engine and on the back office preferences of the channel (Peferences | Recommendation Engines). If the request type UserRecommendationRequest is not enabled, an empty list is returned.
      operationId: getProductRecommendationsUserRequest
      parameters:
        - name: RecommendationContextKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.component.recommendation.capi.rest.resource.RecommendationContextListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionRO"
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.component.recommendation.capi.rest.resource.UserRequestRecommendationsListResource.getProductRecommendations()
      x-origin-class: com.intershop.component.recommendation.capi.rest.resource.UserRequestRecommendationsListResource
      x-AuthorizationRule: "[isAnyUser]"
