openapi: 3.0.1
info:
  title: Basket
  description: |+
    **Note:** This version is deprecated. Please use version 1.0 or higher. However, note that the Basket v1 REST API may not yet support all features of the Basket v0 REST API. Therefore, Intershop will continue to support the Basket v0 REST API until all functionalities are transitioned to the new version. 

    The _Basket REST API_ contains resources that cover aspects of basket handling and preparation of the checkout process.

    A typical checkout process requires a series of REST requests, some of which are based on one another and must therefore take place in a defined sequence. This cannot be sufficiently represented by the OpenAPI documentation only. 
    Detailed descriptions of various checkout scenarios can be found in the [Business Guide "Basket & Checkout REST API"](https://knowledge.intershop.com/kb/2873B2) in the Intershop Knowledge Base.

    Please also refer to the _Order REST API_, which is used to create an order from the appropriately prepared basket and complete the checkout process.

    ## Changelog
    - - -
    ### Version 0.2.1
    * Added this changelog

    ### Version 0.2.0
    * Added read-only attributes `externalID` and `externalUrn` to the `Address` resource object

  version: 0.2.1
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: General
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.basket.BasketResource
  - name: Line Item
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.basket.BasketLineItemResource
  - name: Payment
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.basket.BasketPaymentRedirectResource
  - name: Quote
    description: This section covers operations for managing quotes within a basket. This includes viewing, creating, and deleting quote requests.
    x-origin-class: com.intershop.sellside.rest.b2b.capi.basket.v1.quote.resource.BasketQuoteItemResource
paths:
  /baskets:
    get:
      tags:
        - General
      summary: Gets all open baskets for the current user
      description: Gets a list of all open baskets for the user given by the authentication token.
      operationId: getBaskets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionROLinkRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionROLinkRO"
          links:
            itemInfo:
              operationId: getBasketByID
              parameters:
                BasketResourceKey: $response.body#/elements/{$index}/itemId
              description: Links to item of type BasketRO
        "400":
          description: |-
            Bad request possible values for header error-key:
             - basket.basket_user_required.error
      deprecated: true
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.sellside.rest.common.capi.resource.basket.BasketListResource.getBaskets()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.basket.BasketListResource
      x-AuthorizationRule: "[isAnyUser]"
    post:
      tags:
        - General
      summary: Creates a new basket.
      description: |-
        The request creates a new basket. The client gets a link to the new cart.The server will return the headers `authentication-token` and `Location`. These are required for anonymous users, who have not logged in yet, by providing their credentials. In this case the token has any subsequent request to the basket,because a basket can only be accessed by that user who created it.
         Registered users, that have been logged in before basket creation are not required to sendthe token with subsequent requests.
      operationId: createBasket
      responses:
        "201":
          description: Created
      deprecated: true
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.common.capi.resource.basket.BasketListResource.createBasket()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.basket.BasketListResource
      x-AuthorizationRule: "[isAnyUser]"
  /baskets/{BasketResourceKey}:
    get:
      tags:
        - General
      summary: |-
        Returns the basket's summary.
         Alternatively you may use the URL `/baskets/-` to get the active basket.
      description: |-
        Get baskets summary, containing
         - Customer related basket information, like taxation ID, external order reference ID
         - Shipping buckets with line item references
         - Invoice-to address
         - Promotions applied to the basket
         - Payment methods applied to the basket
         - Sales and shipping taxes
         - Surcharges
         - Promotional discounts
         - Basket totals
         - Recurrence information
         - Document number (is currently only set if basket is in status waiting for approval after submitting)
         - Recurring Order Document number (is only set when Basket is recurring)
         - Affiliate information
         
         In case of basket not found or other error, a status code 400 is returned as a result.
         
         Depending on the flag `isMultipleShippmentSupported` the get request returns the availableshipping methods at the basket level or at the line item level:
         - `isMultipleShippmentSupported = true`:  the shipping methods are available at the line item level and not at the basket level
         - `isMultipleShippmentSupported = false`: the shipping methods are available at the basket level and not at the line item level
      operationId: getBasketByID
      parameters:
        - name: BasketResourceKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.common.capi.resource.basket.BasketListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasketRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/BasketRO"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: |-
            FORBIDDEN Requires authentication with user having assigned the following permissions:
             - Purchase (APP_B2B_PURCHASE, only in B2B applications)
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.basket.BasketRO com.intershop.sellside.rest.common.capi.resource.basket.BasketResource.getBasketByID()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.basket.BasketResource
      x-AuthorizationRule: "[((((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE]) OR hasPermission[Organization:APP_B2B_SEND_OCI_BASKET]) OR hasPermission[Organization:APP_B2B_SEND_CXML_BASKET])]"
    put:
      tags:
        - General
      summary: Sets / updates basket related data, marks the basket as recurrent and sets recurrence information
      description: |-
        Sets following basket related data:
         - commonShipToAddress
         
         If a complete address is specified, this address is set after validation successfully finished. Alternatively, a URN of an existing address (e.g., of an address of a registered customer or a store address) may be passed to use this address if possible. Note that an existing address may only be used if it is marked as an invoice-to address.
         - invoiceToAddress
         
         If a complete address is specified, this address is set after validation successfully finished. Alternatively, a URN of an existing address (e.g., of an address of a registered customer or a store address) may be passed to use this address if possible. Note that an existing address may only be used if it is marked as a ship-to address.
         - commonShippingMethod
         - promotionCode
         
          If the specified promotion code is valid, it is applied to the basket.If the promotion code is not valid, then a validation result is returned.
         - department
         
         Option to set the buyer's department at the basket in case of unregistered checkout.
         - taxationID
         
         Option to set buyer's taxation ID at the basket in case of unregistered checkout.
         - taxExempt
         - purchaseCurrency
         - dynamicMessages
         - externalOrderReferenceID
         
         Option to set a buyer specific order reference ID at the basket.
         - owningUser
         
          Assigns the basket to another user. It is intended to be used to transfer the basket of an anonymous user to a registered user, when the anonymous user logs-in during the checkout. In order to change the owner a valid authentication token of the new user has to be applied.After changing the owner, the current user has no access to this basket anymore!
         - multipleShippmentsSupported
         - recurrence (required fields: StartDate, Recurrence Interval; optional fields: EndDate, Number of repetitions)
         
         The recurrence Interval is defined as Java period Object, that supports ISO 8601. It allows numerous possibilities to set the interval.
         The string always starts with a 'P' for period. The interval can contain a number of years (Y), months (M) weeks (W) or Days (D) or any combination of them.
         The number is placed in front of the unit. Weeks are transformed to days by multiplying with 7 -> (P4W = P28D).
         
         
        NOTE: 
         By default the subscriptions feature is disabled for the channel. 
      operationId: editBasketByID
      parameters:
        - name: BasketResourceKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.common.capi.resource.basket.BasketListResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BasketRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/BasketRO"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasketRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/BasketRO"
        "400":
          description: |-
            Bad request 
             Possible values for header 'error-key:
             - basket.addreess_not_found_error
             - basket.basket_id_required.error
             - basket.invalid_address.error
             - basket.store_addresses_not_allowed.error
             - customer.address.missing_fields.error
             - basket.recurring_not_allowed.error
             - basket.cost_center.no_customer.error
             - basket.cost_center.invalid_customer.error
             - basket.cost_center.not_found.error
             - basket.affiliate.invalid.error
             - basket.promotioncode.invalid.error.{xxx}
             
             Possible messages for missing attributes:
             - interval
             - startDate
        "401":
          description: Unauthorized
        "404":
          description: |-
            Not found
             possible values for header 'error-key':
             - basket.basket_not_found.error
        "501":
          description: |-
            Not implemented (if the recurring order feature is disabled),
             possible values for header 'error-key':
             - error.recurring_orders.disabled
        "503":
          description: Service unavailable (if Microservice is not available and/or cannot be discovered)
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.basket.BasketRO com.intershop.sellside.rest.common.capi.resource.basket.BasketResource.editBasketByID(com.intershop.sellside.rest.common.capi.resourceobject.basket.BasketRO)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.basket.BasketResource
      x-AuthorizationRule: "[((((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE]) OR hasPermission[Organization:APP_B2B_SEND_OCI_BASKET]) OR hasPermission[Organization:APP_B2B_SEND_CXML_BASKET])]"
    options:
      tags:
        - General
      summary: Returns all available options for the given basket
      description: |-
        Returns the following available options for the given basket:
         - common shipping methods

         Depending on the flag `isMultipleShippmentSupported` the option request returnsall available shipping methods for the whole basket or the option request returns nothing:
         - `isMultipleShippmentSupported = true`: There are no shipping methods for the whole basket availablebecause the shipping methods are only available at the line item level
         - `isMultipleShippmentSupported = false`: The option request returns all available shipping methodsfor the whole basket (shipping methods on basket level)
      operationId: getBasketOptions
      parameters:
        - name: BasketResourceKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.common.capi.resource.basket.BasketListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
