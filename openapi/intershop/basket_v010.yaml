      x-origin-class: com.intershop.application.storefront.rest.b2b.capi.order.costobject.resource.BasketCostObjectAssignmentListResource
      x-AuthorizationRule: "[hasPermission[Organization:APP_B2B_VIEW_COSTOBJECT], hasPermission[Organization:APP_B2B_VIEW_COSTOBJECT], ((((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE]) OR hasPermission[Organization:APP_B2B_SEND_OCI_BASKET]) OR hasPermission[Organization:APP_B2B_SEND_CXML_BASKET])]"
    post:
      tags:
        - Cost Object
      summary: (Deprecated) Assigns a cost object to the basket
      description: This operation is deprecated. The Cost Object feature is no longer supported.
      operationId: createCostObjectAssignment
      parameters:
        - name: BasketResourceKey
          in: path
