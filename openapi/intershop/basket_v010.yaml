      x-AuthorizationRule: "[hasPermission[Organization:APP_B2B_ASSIGN_COSTOBJECT_TO_BASKET], hasPermission[Organization:APP_B2B_ASSIGN_COSTOBJECT_TO_BASKET], ((((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE]) OR hasPermission[Organization:APP_B2B_SEND_OCI_BASKET]) OR hasPermission[Organization:APP_B2B_SEND_CXML_BASKET])]"
