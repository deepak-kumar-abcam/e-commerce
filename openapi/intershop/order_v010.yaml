openapi: 3.0.1
info:
  title: Order
  description: |-
    **Note:** This version is deprecated. Please use version 1.0 or higher. However, note that the Order v1 REST API may not yet support all features of the Order v0 REST API. Therefore, Intershop will continue to support the Order v0 REST API until all functionalities are transitioned to the new version. 

    The _Order REST API_ contains resources that cover aspects of the checkout process and order handling.

    A typical checkout process requires a series of REST requests, some of which are based on one another and must therefore take place in a defined sequence. This cannot be sufficiently represented by the OpenAPI documentation only.
    Detailed descriptions of various checkout scenarios can be found in the [Business Guide "Basket & Checkout REST API"](https://knowledge.intershop.com/kb/2873B2) in the Intershop Knowledge Base.

    ## Changelog
    - - -
    ### Version 0.2.1
    * Added this changelog

    ### Version 0.2.0
    * Added read-only attributes `externalID` and `externalUrn` to the `Address` resource object
  version: 0.2.1
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: General
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.order.OrderResource
paths:
  /orders:
    get:
      tags:
        - General
      summary: Get order history list
      description: |-
        Get a list of links to orders of logged-in user
         ResourceCollectionRO contains objects of type LinkRO
      operationId: getOrderList
      parameters:
        - name: pageable
          in: query
          description: the ID of the respective pageable
          schema:
            type: string
        - name: offset
          in: query
          description: the pageable offset
          schema:
            type: integer
            format: int32
        - name: amount
          in: query
          description: the pageable amount
          schema:
            type: integer
            format: int32
        - name: attrs
          in: query
          schema:
            type: string
        - name: view
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionROLinkRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionROLinkRO"
          links:
            itemInfo:
              operationId: getOrder
              parameters:
                orderKey: $response.body#/elements/{$index}/itemId
              description: Links to item of type OrderRO
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: FORBIDDEN
        "500":
          description: |-
            Internal Server Error
             possible values for header value error-key:
             - search.error
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.sellside.rest.common.capi.resource.order.OrderListResource.getOrderList(java.lang.String,java.lang.Integer,java.lang.Integer,java.lang.String,java.lang.String) throws com.intershop.beehive.foundation.quantity.CurrencyException
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.order.OrderListResource
      x-AuthorizationRule: "[((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE])]"
    post:
      tags:
        - General
      summary: Create new order
      description: |-
        Creates/submits an order.
         When created, this call returns a LinkRO to the created order.
         in genreal, failures that occur during error creation will be sent with the `failures` fieldof the response
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDescriptionRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/OrderDescriptionRO"
      responses:
        "201":
          description: Created
        "202":
          description: |-
            Accepted
             returned for example if the order has not been approved yet
        "404":
          description: |-
            Not found
             example reasons:
             - wrong basketID
             - order already created for this basketID
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.common.capi.resource.order.OrderListResource.createOrder(com.intershop.sellside.rest.common.capi.resourceobject.OrderDescriptionRO)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.order.OrderListResource
      x-AuthorizationRule: "[((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE])]"
  /orders/{orderKey}:
    get:
      tags:
        - General
      summary: Get order details
      description: Get detailed information of the order with given orderID for logged-in user
      operationId: getOrder
      parameters:
        - name: orderKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.common.capi.resource.order.OrderListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/OrderRO"
        "401":
          description: Unauthorized
        "403":
          description: |-
            FORBIDDEN
             if ID of current user does not match userID of order
        "404":
          description: |-
            Not found
             possible values for header error-key:
             - order.tracking.error
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.order.OrderRO com.intershop.sellside.rest.common.capi.resource.order.OrderResource.getOrder()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.order.OrderResource
      x-AuthorizationRule: "[((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE])]"
    put:
      tags:
        - General
      summary: Cancel an order
      description: |-
        Cancel an Order.
         If successfull, `status` of returned OrderRO is CANCELED
      operationId: cancelOrder
      parameters:
        - name: orderKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.common.capi.resource.order.OrderListResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/OrderRO"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/OrderRO"
        "400":
          description: |-
            Bad request
             possible values for header error-key:
             - order.wrong_status
             - order.cancel.error
             - order.cancel.not_possible.error
        "401":
          description: Unauthorized
        "403":
          description: FORBIDDEN
        "404":
          description: Not found
        "409":
          description: |-
            Conflict
             possible values for header error-key:
             - order.cancel.not_possible.status
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.order.OrderRO com.intershop.sellside.rest.common.capi.resource.order.OrderResource.cancelOrder(com.intershop.sellside.rest.common.capi.resourceobject.order.OrderRO) throws com.intershop.beehive.foundation.quantity.CurrencyException
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.order.OrderResource
      x-AuthorizationRule: "[((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE])]"
  /orders/{orderKey}/costobjects:
    get:
      tags:
        - Cost Object
      summary: (Deprecated) Returns the cost objects assigned to the selected order
      description: |-
        This operation is deprecated. The Cost Object feature is no longer supported.

         ResourceCollectionRO contains elements of type LinkRO
      operationId: getOrderCostObjectAssignments
      parameters:
        - name: orderKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.common.capi.resource.order.OrderListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionROLinkRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ResourceCollectionROLinkRO"
          links:
            itemInfo:
              operationId: getOrderCostObjectAssignment
              parameters:
                OrderCostObjectAssignmentKey: $response.body#/elements/{$index}/itemId
              description: Links to item of type CostObjectAssignmentRO
        "401":
          description: Unauthorized
        "403":
          description: |-
            FORBIDDEN
             Requires authentication with a user who has been assigned the following permissions:
             - View Cost Object (APP_B2B_VIEW_COSTOBJECT)
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.application.storefront.rest.b2b.capi.order.costobject.resource.OrderCostObjectAssignmentListResource.getOrderCostObjectAssignments()
      x-origin-class: com.intershop.application.storefront.rest.b2b.capi.order.costobject.resource.OrderCostObjectAssignmentListResource
      x-AuthorizationRule: "[hasPermission[Organization:APP_B2B_VIEW_COSTOBJECT], ((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE])]"
  /orders/{orderKey}/costobjects/{OrderCostObjectAssignmentKey}:
    get:
      tags:
        - Cost Object
      summary: (Deprecated) Returns a specific cost object assigned to the selected order
      description: This operation is deprecated. The Cost Object feature is no longer supported.
      operationId: getOrderCostObjectAssignment
      parameters:
        - name: orderKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.common.capi.resource.order.OrderListResource
        - name: OrderCostObjectAssignmentKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.application.storefront.rest.b2b.capi.order.costobject.resource.OrderCostObjectAssignmentListResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostObjectAssignmentRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/CostObjectAssignmentRO"
        "401":
          description: Unauthorized
        "403":
          description: |-
            FORBIDDEN
             Requires authentication with a user who has been assigned the following permissions:
             - View Cost Object (APP_B2B_VIEW_COSTOBJECT)
        "404":
          description: Not found
      deprecated: true
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.application.storefront.rest.b2b.capi.costobject.resourceobject.CostObjectAssignmentRO com.intershop.application.storefront.rest.b2b.capi.order.costobject.resource.OrderCostObjectAssignmentItemResource.getOrderCostObjectAssignment()
      x-origin-class: com.intershop.application.storefront.rest.b2b.capi.order.costobject.resource.OrderCostObjectAssignmentItemResource
      x-AuthorizationRule: "[hasPermission[Organization:APP_B2B_VIEW_COSTOBJECT], ((NOT isAuthenticated[Organization] OR isCustomerType) OR hasPermission[Organization:APP_B2B_PURCHASE])]"
components:
  schemas:
    AbstractResourceObject:
      title: Object
      type: object
      properties:
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          readOnly: true
          xml:
            attribute: true
      description: The list of elements
    AddressRO:
      title: Address
      type: object
      properties:
        addressLine1:
          type: string
          description: the first address line
          example: Berliner Str. 20
        addressLine2:
          type: string
          description: the second address line
          example: 1st Floor
        addressLine3:
          type: string
          description: The third address line
          example: Second door on the right
        addressName:
          type: string
          description: The name of the address
          example: customeraddr-ABCDEFGPRMuMCscyXgSRVU
        aristocraticTitle:
          type: string
          description: the aristocratic title of the contact person, like <i>Lord</i> or <i>Lady</i>
        city:
          type: string
          description: The name of the city
          example: Potsdam
        companyName1:
          type: string
          description: the company name
          example: PMiller ltd.
        companyName2:
          type: string
          description: The second company name
        country:
          type: string
          description: The display name of the country in the current locale
          example: Germany
        countryCode:
          type: string
          description: The country code
          example: DE
        email:
          type: string
          description: the e-mail address of the contact person
          example: pmiller@intershop.de
        externalId:
          type: string
          description: The ID uniquely identifying the address in an external system; required only for data objects that have already been synchronized with the external system
          readOnly: true
          example: "000123456"
        externalUrn:
          type: string
          description: The URN uniquely identifying the address in an external system; required only for  data objects that have already been synchronized with the external system
          readOnly: true
          example: urn:address:MSDynamics365:MyCorp:000123456
        externalURN:
          type: string
          description: The URN uniquely identifying the address in an external system; required only for data objects that have already been synchronized with the external system.
          example: A049364112643
        fax:
          type: string
          description: the fax number
          example: "049364112643"
        firstName:
          type: string
          description: The (first) given name of the contact person
          example: Patricia
        honorific:
          type: string
          description: the honorific title of the contact person that denotes the honored person's occupation, like <i>Captain</i>, <i>Coach</i>, <i>Officer</i>, <i>Reverend</i> or the academic title, like <i>PhD</i>
        id:
          type: string
          description: The ID of the returned element
          example: vagKAB17gg4AAAFGSkFqQASI
        jobTitle:
          type: string
          description: the job title of the contact person
          example: CEO
        lastName:
          type: string
          description: The last name of the contact person
          example: Miller
        mainDivision:
          type: string
          description: the main division of the country, e. g. a state or province
          example: AL
        mainDivisionName:
          type: string
          description: The localized display name of the main division
          example: Alabama
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        phoneBusiness:
          type: string
          description: The phone number of the contact person's company
          example: "049364112699"
        phoneBusinessDirect:
          type: string
          description: the business phone number of the contact person that allows an outside caller to connect directly to the contact person without any help of an attendant or operator
          example: "049364112659"
        phoneHome:
          type: string
          description: The phone number of the house or apartment where the contact person lives
          example: "049364112677"
        phoneMobile:
          type: string
          description: The number of the contact person's cell phone
          example: "+49364112677"
        postalCode:
          type: string
          description: The postal code
          example: "14482"
        postBox:
          type: string
          description: the post-office box
          example: PO Box 42
        secondLastName:
          type: string
          description: the second last name of the contact person
        secondName:
          type: string
          description: the second given name of the contact person
          example: Luise
        subDivision:
          type: string
          description: The sub division code of the country.
          example: GB-PKN
        subDivisionName:
          type: string
          description: The localized display name of the sub division
          example: Perth and Kinross
        title:
          type: string
          description: The (personal) title of the contact person, like 'Mr.' or 'Ms.'
          example: Mrs.
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          example: Address
          xml:
            attribute: true
        urn:
          type: string
          description: the URN representation of this address
          example: urn:address:customer:1234567890:0987654321
        usage:
          type: object
          properties:
            empty:
              type: boolean
          description: " Returns usage information for the address. Every bit in the returned set marks a specific usage type, like ship-from or invoice-to address. If a bit is set, the address may be used for the specific purpose mapped to this bit. Further bits may be used for custom types. Default usage for first 4 bits are Invoice-to, Ship-to, Service-to and Install-to"
      description: This resource holds the details of an address.
      xml:
        name: Address
    AppliedRebateRO:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/MoneyRO"
        code:
          type: string
          description: the code of the applied rebate
          example: INTERSHOP
        description:
          type: string
          description: The description of the applied rebate
          example: For orders over 200 USD, a 10 USD Order discount is guaranteed for the Promo Code 'INTERSHOP'.
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        rebateType:
          type: string
          description: the type of the applied rebate
          example: OrderValueOffDiscount
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          example: AppliedRebate
          xml:
            attribute: true
      description: the shipping rebates for this order
      xml:
        name: AppliedRebate
    AppliedTaxRO:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/MoneyRO"
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        rate:
          type: number
          description: the tax rate, 100 = 100%
          example: 19
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          example: AppliedTax
          xml:
            attribute: true
      description: The Shipping Tax Totals by tax rate for this order
      xml:
        name: AppliedTax
    CostObjectAssignmentRO:
      type: object
      properties:
        name:
          type: string
          description: The name of an element
          example: "451"
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          example: Project
      xml:
        name: CostObjectAssignment
    GenericPropertyROObject:
      type: object
      properties:
        displayName:
          type: string
        key:
          type: string
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        property:
          type: object
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          readOnly: true
          xml:
            attribute: true
      xml:
        name: Property
    LinkRO:
      title: Link
      type: object
      properties:
        attribute:
          $ref: "#/components/schemas/ResourceAttribute"
        attributes:
          type: array
          description: The list of attributes
          xml:
            wrapped: true
          items:
            $ref: "#/components/schemas/ResourceAttribute"
        description:
          type: string
          description: The description of the link
        itemId:
          type: string
          description: The ID of the linked item
        name:
          type: string
          description: The name of the returned element
          xml:
            attribute: true
        relation:
          type: string
          description: The relation of the link
          externalDocs:
            description: Link Relations (www.iana.org)
            url: http://www.iana.org/assignments/link-relations/link-relations.xml
          enum:
            - about
            - alternate
            - appendix
            - archives
            - author
            - bookmark
            - canonical
            - chapter
            - collection
            - contents
            - copyright
            - create-form
            - current
            - describedby
            - describes
            - disclosure
            - duplicate
            - edit
            - edit-form
            - edit-media
            - enclosure
            - first
            - glossary
            - help
            - hosts
            - hub
            - icon
            - index
            - item
            - last
            - latest-version
            - license
            - lrdd
            - monitor
            - monitor-group
            - next
            - next-archive
            - nofollow
            - noreferrer
            - payment
            - predecessor-version
            - prefetch
            - prev
            - preview
            - previous
            - prev-archive
            - privacy-policy
            - profile
            - related
            - replies
            - search
            - section
            - self
            - service
            - start
            - stylesheet
            - subsection
            - successor-version
            - tag
            - terms-of-service
            - type
            - up
            - version-history
            - via
            - working-copy
            - working-copy-of
        title:
          type: string
          description: The title of the link
        type:
          type: string
          description: "This is a constant: **Link**"
          readOnly: true
          example: Link
          xml:
            attribute: true
        uri:
          type: string
          description: The URI
      description: A Link pointing to a resource
      xml:
        name: Link
    MoneyRO:
      title: Money
      type: object
      properties:
        currency:
          type: string
          description: Three-letter currency code (ISO 4217) of the monetary value
          example: USD
        currencyMnemonic:
          type: string
          deprecated: true
        type:
          type: string
          description: "This is a constant: **Money**"
          readOnly: true
          example: Money
          xml:
            attribute: true
        value:
          type: number
          description: The monetary value
          example: 10.99
      description: Money combines a currency and a money amount.
      xml:
        name: Money
    OrderDescriptionRO:
      type: object
      properties:
        acceptTermsAndConditions:
          type: boolean
          description: did the customer accept the terms and conditions
        basketID:
          type: string
          description: the id of the corresponding basket
          example: u.0KDgAjIYsAAAFjIQxW6PNc
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        paymentInformations:
          $ref: "#/components/schemas/OrderPaymentInformationsRO"
        type:
          type: string
          description: "The type of the element. This is normally a **constant** that can be used to differentiate elements by their type. "
          example: OrderDescription
          xml:
            attribute: true
      deprecated: true
      xml:
        name: OrderDescription
    OrderLineItemRO:
      type: object
      properties:
        availability:
          type: boolean
          description: indicates if the line item is available
        bundleProduct:
          type: boolean
          description: indicates if the line item is part of a bundle
          example: false
        fulfillmentStatus:
          type: string
          description: the fulfillment status of the line item
          example: NEW
        giftMessage:
          $ref: "#/components/schemas/LinkRO"
        giftwrap:
          $ref: "#/components/schemas/LinkRO"
        greetingMessage:
          type: string
          description: the greeting message
          example: Greetings!
        id:
          type: string
          description: the id of the line item
          example: 2hIKAB17haUAAAFG4.xU7mGD
        isFreeGift:
          type: boolean
          description: indicates if the line item is a free gift
          example: false
        isHiddenGift:
          type: boolean
          description: indicates if the line item is a hidden gift
          example: false
        itemImportSurcharges:
          type: array
          description: the line item's import surcharges
          xml:
            wrapped: true
          items:
            $ref: "#/components/schemas/SurchargeRO"
        itemSurcharges:
          type: array
          description: the line item's surcharges
          xml:
            wrapped: true
          items:
            $ref: "#/components/schemas/SurchargeRO"
        name:
          type: string
          description: The name of an element
          xml:
            attribute: true
        position:
          type: integer
          description: the position of the line item
          format: int32
          example: 1
        price:
          $ref: "#/components/schemas/MoneyRO"
        product:
          $ref: "#/components/schemas/LinkRO"
        quantity:
          $ref: "#/components/schemas/QuantityRO"
        recipientEmail:
          type: string
          description: the email of the recipient
          example: f.birdo@test.intershop.de
        recipientName:
          type: string
          description: the name of the recipient
          example: Fritz Birdo
        salesTaxes:
          type: array
          description: the line item's applied taxes
          xml:
            wrapped: true
          items:
            $ref: "#/components/schemas/AppliedTaxRO"
        senderEmail:
