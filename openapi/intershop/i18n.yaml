openapi: 3.0.1
info:
  title: Internationalization
  description: |-
    The _Internationalization REST API_ provides localizations and country details.

    ## Changelog
    - - -
    ### Version 1.0.2
    * Fallbacks to lead locale implemented for the `/localizations` and `/localizations/{key}` endpoints.
    * Documentation enhanced regarding the fallbacks to lead locale for the `/localizations` and `/localizations/{key}` endpoints.

    ### Version 1.0.1
    * Added response documentation for the `/localizations` endpoint.

    ### Version 1.0.0
    * Created a separate REST API 'Internationalization' out of 'Shop'
  version: 1.0.2
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: Country
    description: This section covers operations for retrieving available countries, their details, and main divisions.
    x-origin-class: com.intershop.sellside.rest.country.v1.capi.resource.country.CountryListResource
  - name: Localizations
    description: |-
      The localizations REST API endpoint allows clients to obtain a list of localized texts or specific localization keys. All operations support different locales. Use the matrix parameter ```loc``` to select texts for a specific locale.

      The returned localization value is the imported or defined value without any replacements or formatting (the server location functionality requires the Java Message Format for these values).

      ## Example Usage
      Following (JUnit Test) example shows how to retrieve localized texts for a site:

      ```
      curl https://<SERVER>/INTERSHOP/rest/WFS/<SITE>/-/localizations
      ```
    x-origin-class: com.intershop.beehive.platformrest.resource.localization.LocalizationResource
paths:
  /countries:
    get:
      tags:
        - Country
      summary: Returns available countries for the channel
      description: |
        This operation returns a list of countries currently available for the channel. A country is considered available if it is included in an active region as part of an active freight class of a shipping eligibility. Additionally, the region and eligibility must have at least one shipping method assigned. It is not mandatory for the assigned shipping method to be active.
      operationId: getCountries_V1
      responses:
        "200":
          description: OK - The available countries were successfully retrieved.
          content:
            application/vnd.intershop.country.v1+json:
              schema:
                $ref: "#/components/schemas/GeoObjectListCtnrRO_v1"
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.country.v1.capi.resource.country.CountryListResource.getCountries_V1()
      x-origin-class: com.intershop.sellside.rest.country.v1.capi.resource.country.CountryListResource
      x-AuthorizationRule: "[isAnyUser]"
  /countries/{countryCode}:
    get:
      tags:
        - Country
      summary: Returns country details for a given country code
      description: This operation returns the country details for the specified country code.
      operationId: getCountry_V1
      parameters:
        - name: countryCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK - The requested country details were successfully retrieved.
          content:
            application/vnd.intershop.country.v1+json:
              schema:
                $ref: "#/components/schemas/GeoObjectCtnrRO_v1"
        "404":
          description: Not found - A country with the given code could not be found.
          content:
            application/vnd.intershop.country.v1+json:
              schema:
                $ref: "#/components/schemas/FeedbackCtnrRO_v1"
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.country.v1.capi.resource.country.CountryItemResource.getCountry_V1()
      x-origin-class: com.intershop.sellside.rest.country.v1.capi.resource.country.CountryItemResource
      x-AuthorizationRule: "[isAnyUser]"
  /countries/{countryCode}/main-divisions:
    get:
      tags:
        - Country
      summary: Returns available main divisions for a given country code
      description: This operation returns the available main divisions for the specified country code.
      operationId: getMainDivisions_V1
      parameters:
        - name: countryCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK - The available main divisions were successfully retrieved.
          content:
            application/vnd.intershop.country.v1+json:
              schema:
                $ref: "#/components/schemas/GeoObjectListCtnrRO_v1"
        "404":
          description: Not found - A country with the given code could not be found.
          content:
            application/vnd.intershop.country.v1+json:
              schema:
                $ref: "#/components/schemas/FeedbackCtnrRO_v1"
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.country.v1.capi.resource.maindivision.MainDivisionListResource.getMainDivisions_V1()
      x-origin-class: com.intershop.sellside.rest.country.v1.capi.resource.maindivision.MainDivisionListResource
      x-AuthorizationRule: "[isAnyUser]"
  "{loc}/localizations":
    get:
      tags:
        - Localizations
      summary: Returns localized texts
      description: This operation returns a map that contains localized texts for the requested locale specified by the matrix parameter '''loc'''. If the requested locale does not contain all the keys that are part of the lead locale such keys and the associate values are taken from the lead locale.
      operationId: getLocalizations
      parameters:
        - $ref: "#/components/parameters/loc"
        - name: searchKeys
          in: query
          description: Optional comma-separated list of search keys. Returns only localizations containing at least one search key.
          schema:
            type: string
            description: Optional comma-separated list of search keys. Returns only localizations containing at least one search key.
            example: error,webform
          example: error,webform
      responses:
        "200":
          description: OK - The localized texts have been successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: string
      x-origin-method: public java.util.Map com.intershop.beehive.platformrest.resource.localization.LocalizationResource.getLocalizations(java.lang.String)
      x-origin-class: com.intershop.beehive.platformrest.resource.localization.LocalizationResource
      x-AuthorizationRule: "[isAnyUser]"
  "{loc}/localizations/{key}":
    get:
      tags:
        - Localizations
      summary: Returns localized text for a given key
      description: This operation returns the localized text for a given key in the requested locale specified by the matrix parameter '''loc'''. If the requested locale does not contain the requested key it is taken from the lead locale.
      operationId: getLocalization
      parameters:
        - $ref: "#/components/parameters/loc"
        - name: key
          in: path
          description: The localization key
          required: true
          schema:
            pattern: "[^/]*"
            type: string
            description: The localization key
            example: account.giftcard.form.ok
          example: account.giftcard.form.ok
      responses:
        "200":
          description: OK - The localized text has been successfully retrieved.
          content:
            text/plain:
              schema:
                type: string
        "204":
          description: No Content - The localization key is not available.
      x-origin-method: public java.lang.String com.intershop.beehive.platformrest.resource.localization.LocalizationResource.getLocalization(java.lang.String)
      x-origin-class: com.intershop.beehive.platformrest.resource.localization.LocalizationResource
      x-AuthorizationRule: "[isAnyUser]"
