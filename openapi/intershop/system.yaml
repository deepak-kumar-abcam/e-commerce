openapi: 3.0.1
info:
  title: System
  description: "# Intershop System REST Endpoints


    These REST endpoints provide access to internal artifacts which are used within ICM.\ 

    This allows developers and technical operators to review or maintain certain aspects of an application server.


    ## Note

    Some of the endpoints are considered not to be API and might change in upcoming versions in a non-compatible kind.\ 

    \  "
  version: 1.0.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: Applications
    description: |-
      # Applications
      The applications endpoint allows clients to obtain information about applications available in the system.

      ## Note
      This endpoint is NO API and might change in upcoming versions
    x-origin-class: com.intershop.beehive.platformrest.resource.system.application.ApplicationResource
  - name: Application Types
    description: |-
      # Application Types
      The applications endpoint allows clients to obtain information about application types available in the system.
      Application types provide context for several functions, like the component model, extensions, the lookup of pipelines, templates and other artifacts.
      This context is mainly expressed as the list of assigned cartridges.

      ## Note
      This endpoint is NO API and might change in upcoming versions
    x-origin-class: com.intershop.beehive.platformrest.resource.system.application.ApplicationTypeResource
  - name: Caches
    description: |-
      # Caches
      The caches endpoint allows clients to obtain information about caches.
       
      ## Note
      This endpoint is NO API and might change in upcoming versions
    x-origin-class: com.intershop.beehive.platformrest.resource.system.cache.CacheResource
  - name: Cartridges
    description: |-
      # Cartridges
      The cartridges endpoint allows clients to obtain information about cartridges.
      Cartridges are modules and building blocks that contain the functionality of the Application server. 

      ## Note
      This endpoint is NO API and might change in upcoming versions
    x-origin-class: com.intershop.beehive.platformrest.resource.system.cartridge.CartridgeResource
  - name: Configurations
    description: |-
      # Configuration
      The configurations endpoint allows clients to obtain information about configurations and server properties.
       
      ## Note
      This endpoint is NO API and might change in upcoming versions
    x-origin-class: com.intershop.beehive.platformrest.resource.system.configuration.ConfigurationResource
  - name: Domains
    description: |-
      # Domains
      The domains endpoint allows clients to obtains information about domains.
       
      ## Note
      This endpoint is NO API and might change in upcoming versions
    x-origin-class: com.intershop.beehive.platformrest.resource.system.domain.DomainResource
  - name: Organizations
    description: |-
      # Organizations
      The organizations endpoint allows clients to obtain information about organizations.
       
      ## Note
      This endpoint is NO API and might change in upcoming versions
    x-origin-class: com.intershop.beehive.platformrest.resource.system.organization.OrganizationResource
