openapi: 3.0.1
info:
  title: Punchout cXML External
  description: |-
    The Intershop Punchout cXML ‘External’ REST API contains the external endpoints that are called directly from external systems, such as procurement systems, to start and end a Punchout session.

    Unlike other Intershop REST APIs, this REST API does not use version-based content negotiation, as this is not supported by the cXML standard.
    Therefore, there is only one endpoint under the specified URL, which generates the cXML content as `text/xml` without any version information. 

    ## Accept Header
    The accept header does not contain any version information. Just use `text/xml`, `*` or `*.*`.

    ## Changelog

    ### Version 2.5.0
    * Implemented a dedicated endpoint for cXML Punchout order creation, replacing the former pipeline-based approach (ProcessCXMLOrderInjection-Start).
    ### Version 2.4.0
    * "External" endpoints ("setuprequest", "transfer") that do not support version-based content negotiation were moved to this REST API ("Punchout cXML External") without any changes in content.
  version: 2.5.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: General
    description: This section covers operations to manage cXML sessions, baskets, and orders.
    x-origin-class: com.intershop.sellside.rest.b2b.punchout.v2.capi.cxml.resource.CXMLPunchoutTransferBasketResource
paths:
  /customers/{CustomerKey}/punchouts/cxml1.2/orderrequest:
    post:
      tags:
        - General
      summary: Creates a cXML Punchout order
      description: |-
        This operation processes a Punchout order request by accepting an OrderRequest cXML document and creating the corresponding order in the system. 
        This requires valid login credentials in the submitted cXML document.

        To use this operation, an authenticated user with the permission "Receive cXML Order" (APP_B2B_RECEIVE_CXML_ORDER) is required.
      operationId: CXMLPunchoutOrderRequest
      parameters:
        - name: CustomerKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.smb.capi.resource.customer.CustomerListResource
      requestBody:
        content:
          "*/*":
            schema:
              type: string
      responses:
        "200":
          description: OK - The cXML Punchout order has been successfully created.
          content:
            text/xml:
              schema:
                $ref: "#/components/schemas/CXML"
        "401":
          description: Unauthorized - The user could not be authenticated.
        "403":
          description: Forbidden - The user does not have the required permissions.
        "404":
          description: Not found - The customer could not be found or cXML Punchout is not supported.
      security:
        - bearerAuth: []
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.b2b.punchout.v2.capi.cxml.resource.CXMLPunchoutOrderRequestResource.orderRequest(java.lang.String)
      x-origin-class: com.intershop.sellside.rest.b2b.punchout.v2.capi.cxml.resource.CXMLPunchoutOrderRequestResource
      x-AuthorizationRule: "[(isMemberOfCustomer AND hasPermission[Organization:APP_B2B_RECEIVE_CXML_ORDER]), (isMemberOfCustomer AND (hasPermission[Organization:APP_B2B_VIEW_PUNCHOUT] OR hasPermission[Organization:APP_B2B_SEND_OCI_BASKET])), (isMemberOfCustomer AND (hasPermission[Organization:APP_B2B_VIEW_PUNCHOUT] OR hasPermission[Organization:APP_B2B_SEND_CXML_BASKET])), isMemberOfCustomer]"
  /customers/{CustomerKey}/punchouts/cxml1.2/setuprequest:
    post:
      tags:
        - General
      summary: Creates a cXML Punchout session
      description: |-
        This operation performs a Punchout setup request, i.e., it initiates a new Punchout session and returns the URL to the web shop. The URL contains an access token and a session ID (sid) that can be used to get further information about the session.
        This requires valid login credentials in the submitted cXML document.
      operationId: CXMLPunchoutSetupRequest
      parameters:
        - name: CustomerKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.smb.capi.resource.customer.CustomerListResource
      requestBody:
        content:
          "*/*":
            schema:
              type: string
      responses:
        "200":
          description: OK - The cXML Punchout has been successfully triggered.
          content:
            text/xml:
              schema:
                $ref: "#/components/schemas/CXML"
        "401":
          description: Unauthorized - The user could not be authenticated.
        "403":
          description: Forbidden - The user does not have the required permissions.
        "404":
          description: Not found - The customer could not be found or cXML Punchout is not supported.
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.b2b.punchout.v2.capi.cxml.resource.CXMLPunchoutSetupRequestResource.setupRequest(java.lang.String)
      x-origin-class: com.intershop.sellside.rest.b2b.punchout.v2.capi.cxml.resource.CXMLPunchoutSetupRequestResource
      x-AuthorizationRule: "[isAnyUser, (isMemberOfCustomer AND (hasPermission[Organization:APP_B2B_VIEW_PUNCHOUT] OR hasPermission[Organization:APP_B2B_SEND_OCI_BASKET])), (isMemberOfCustomer AND (hasPermission[Organization:APP_B2B_VIEW_PUNCHOUT] OR hasPermission[Organization:APP_B2B_SEND_CXML_BASKET])), isMemberOfCustomer]"
  /customers/{CustomerKey}/punchouts/cxml1.2/transfer:
    post:
      tags:
        - General
      summary: Triggers the cXML Punchout basket transfer
      description: |-
        This operation triggers the transfer of the cXML Punchout basket back to the external system, such as a procurement system. The following steps are performed during this process:
        * An XML document (cXML Punchout format) including all line items of the basket is returned. The whole document has to be posted by the client to the procurement system.
        * The Punchout basket is closed and cannot be used anymore.
        * The Punchout workflow ends and is recorded for license purposes.

        To use this operation, an authenticated user with the permission "Send cXML Cart" (APP_B2B_SEND_CXML_BASKET) is required.
      operationId: CXMLPunchoutTransferBasket
      parameters:
        - name: sid
          in: query
          description: The ID of the cXML Punchout session
          schema:
            type: string
            description: The ID of the cXML Punchout session
        - name: CustomerKey
          in: path
          description: The key or UUID to resolve a single item
          required: true
          schema:
            type: string
          example: ExampleKey
          x-item-key: com.intershop.sellside.rest.smb.capi.resource.customer.CustomerListResource
      responses:
        "200":
          description: OK - The cXML Punchout basket transfer has been successfully triggered.
          content:
            text/xml:
              schema:
                $ref: "#/components/schemas/CXML"
        "401":
          description: Unauthorized - The user could not be authenticated.
        "403":
          description: Forbidden - The user does not have the required permissions.
      security:
        - bearerAuth: []
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.b2b.punchout.v2.capi.cxml.resource.CXMLPunchoutTransferBasketResource.transferBasket(java.lang.String)
      x-origin-class: com.intershop.sellside.rest.b2b.punchout.v2.capi.cxml.resource.CXMLPunchoutTransferBasketResource
      x-AuthorizationRule: "[(isMemberOfCustomer AND hasPermission[Organization:APP_B2B_SEND_CXML_BASKET]), (isMemberOfCustomer AND (hasPermission[Organization:APP_B2B_VIEW_PUNCHOUT] OR hasPermission[Organization:APP_B2B_SEND_OCI_BASKET])), (isMemberOfCustomer AND (hasPermission[Organization:APP_B2B_VIEW_PUNCHOUT] OR hasPermission[Organization:APP_B2B_SEND_CXML_BASKET])), isMemberOfCustomer]"
