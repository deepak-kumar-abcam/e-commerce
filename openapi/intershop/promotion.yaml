openapi: 3.0.1
info:
  title: Promotion
  description: The Intershop Promotion REST API contains operations that allow to retrieve promotion information.
  version: 1.2.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: General
    description: "The following operations for retrieving general promotion data are available:"
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.DanaherPromotionResource
  - name: Product
    description: "The following operations for retrieving product-specific promotions are available:"
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.promotion.ProductPromotionResource
paths:
  /products/{productKey}/promotions{spgid}:
    get:
      tags:
        - Product
      summary: Returns applicable promotions for a product
      description: |-
        This operation returns a list of all promotions which are applicable for the current product.

        By default only promotions assigned to the customer group "Everyone" are returned. To retrieve personalized promotions based on direct customer assignment or customer segment, use the `spgid` parameter.
      operationId: getProductPromotionsGETpromo_1
      parameters:
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: promotions
        - name: includeCodePromotions
          in: query
          description: Determines whether code-based promotions are returned. If set to `true`, the complete list of promotions is returned. If set to `false`, only promotions that do not require a promotion code are returned (default).
          schema:
            type: boolean
            description: Determines whether code-based promotions are returned. If set to `true`, the complete list of promotions is returned. If set to `false`, only promotions that do not require a promotion code are returned (default).
            example: true
            default: false
          example: "true"
        - name: productKey
          in: path
          description: The product ID
          required: true
          schema:
            type: string
            description: The product ID
            example: "201807231"
          example: "201807231"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
      responses:
        "200":
          description: OK - The applicable promotions for the given product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkROResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/LinkROResourceCollectionRO"
        "401":
          description: Unauthorized - The user could not be authenticated.
        "404":
          description: Not found - The promotion could not be found.
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.sellside.rest.common.capi.resource.promotion.ProductPromotionResource.getProductPromotions(java.lang.Boolean)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.promotion.ProductPromotionResource
      x-AuthorizationRule: "[isAnyUser]"
  /promotions{spgid}/list:
    post:
      tags:
        - General
      operationId: getPromotionsByIDs
      parameters:
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: promotions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DanaherPromotionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/DanaherPromotionRO"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.common.capi.resource.DanaherPromotionResource.getPromotionsByIDs(java.util.List)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.DanaherPromotionResource
      x-AuthorizationRule: "[isAnyUser]"
  /promotions{spgid}/{promotionID}:
    get:
      tags:
        - General
      operationId: getPromotionByID
      parameters:
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: promotions
        - name: promotionID
          in: path
          required: true
          schema:
            pattern: "[^/]*"
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DanaherPromotionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/DanaherPromotionRO"
        "401":
          description: Unauthorized
        "404":
          description: Not found
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.common.capi.resource.DanaherPromotionResource.getPromotionByID(java.lang.String)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.DanaherPromotionResource
      x-AuthorizationRule: "[isAnyUser]"
  /promotions{spgid}:
    get:
      tags:
        - General
      operationId: getPromotions
      parameters:
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: promotions
        - name: includeCodePromotions
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkROResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/LinkROResourceCollectionRO"
        "401":
          description: Unauthorized
      x-origin-method: public jakarta.ws.rs.core.Response com.intershop.sellside.rest.common.capi.resource.DanaherPromotionResource.getPromotions(java.lang.Boolean)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.DanaherPromotionResource
      x-AuthorizationRule: "[isAnyUser]"
  /categories/{categoriesKey}/products/{productKey}/promotions{spgid}:
    get:
      tags:
        - Product
      summary: Returns applicable promotions for a product
      description: |-
        This operation returns a list of all promotions which are applicable for the current product.

        By default only promotions assigned to the customer group "Everyone" are returned. To retrieve personalized promotions based on direct customer assignment or customer segment, use the `spgid` parameter.
      operationId: getProductPromotionsGETpromo
      parameters:
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: promotions
        - name: includeCodePromotions
          in: query
          description: Determines whether code-based promotions are returned. If set to `true`, the complete list of promotions is returned. If set to `false`, only promotions that do not require a promotion code are returned (default).
          schema:
            type: boolean
            description: Determines whether code-based promotions are returned. If set to `true`, the complete list of promotions is returned. If set to `false`, only promotions that do not require a promotion code are returned (default).
            example: true
            default: false
          example: "true"
        - name: categoriesKey
          in: path
          description: The category ID
          required: true
          schema:
            type: string
            description: The category ID
            example: "151"
          example: "151"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.category.CategoryListResource
        - name: productKey
          in: path
          description: The product ID
          required: true
          schema:
            type: string
            description: The product ID
            example: "201807231"
          example: "201807231"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
      responses:
        "200":
          description: OK - The applicable promotions for the given product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkROResourceCollectionRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/LinkROResourceCollectionRO"
        "401":
          description: Unauthorized - The user could not be authenticated.
        "404":
          description: Not found - The promotion could not be found.
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.sellside.rest.common.capi.resource.promotion.ProductPromotionResource.getProductPromotions(java.lang.Boolean)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.promotion.ProductPromotionResource
      x-AuthorizationRule: "[isAnyUser]"
