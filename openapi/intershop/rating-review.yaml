        "404":
          description: Not Found - The product could not be found.
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource.getProductReviews(java.lang.String,java.lang.Boolean,java.lang.Boolean)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource
      x-AuthorizationRule: "[isAnyUser]"
