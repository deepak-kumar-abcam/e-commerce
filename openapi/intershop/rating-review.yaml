        - name: productKey
          in: path
          description: The product SKU
          required: true
          schema:
            type: string
            description: The product SKU
            example: "10809311"
          example: "10809311"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
      responses:
