openapi: 3.0.1
info:
  title: Rating & Review
  description: |-
    The Rating & Review REST API contains operations that allow to create, retrieve and delete reviews. 

    ## Changelog

    ### Version 1.2.0
    * Changed caching behavior: List requests with only own reviews and detail requests of an own review are not cached anymore.
    * Improved documentation
    * Added this changelog
  version: 1.2.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: Rating and Review
    description: This section covers operations for creating, retrieving, and deleting product reviews.
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.review.ReviewItemResource
paths:
  /categories/{categoriesKey}/products/{productKey}/reviews:
    post:
      tags:
        - Rating and Review
      summary: Creates a review for product
      description: This operation creates a user review for a product. The user must be authenticated.
      operationId: addReview_1
      parameters:
        - name: categoriesKey
          in: path
          description: The category ID
          required: true
          schema:
            type: string
            description: The category ID
            example: "153"
          example: "153"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.category.CategoryListResource
        - name: productKey
          in: path
          description: The product SKU
          required: true
          schema:
            type: string
            description: The product SKU
            example: "10809311"
          example: "10809311"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReviewRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/NewReviewRO"
      responses:
        "201":
          description: Created - The review was successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/LinkRO"
        "400":
          description: Bad Request - At least one attribute is missing or invalid.
        "401":
          description: Unauthorized - The user could not be authenticated.
        "404":
          description: Not Found - The product could not be found.
        "422":
          description: Unprocessable Entity - The customer already created a review for this product.
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.LinkRO com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource.addReview(com.intershop.sellside.rest.common.capi.resourceobject.NewReviewRO)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource
      x-AuthorizationRule: "[]"
  /categories/{categoriesKey}/products/{productKey}/reviews/{ReviewKey}:
    delete:
      tags:
        - Rating and Review
      summary: Deletes product review by ID
      description: This operation deletes a specific user review of a specific product. The review can only be deleted by the user who created it. The user must be authenticated.
      operationId: deleteProductReviewByIDDELETEReviews_1
      parameters:
        - name: categoriesKey
          in: path
          description: The category ID
          required: true
          schema:
            type: string
            description: The category ID
            example: "153"
          example: "153"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.category.CategoryListResource
        - name: productKey
          in: path
          description: The product SKU
          required: true
          schema:
            type: string
            description: The product SKU
            example: "10809311"
          example: "10809311"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
        - name: ReviewKey
          in: path
          description: The review ID
          required: true
          schema:
            type: string
            description: The review ID
            example: aUAKDgAFMa8AAAF2XvNMKHUM
          example: aUAKDgAFMa8AAAF2XvNMKHUM
          x-item-key: com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource
      responses:
        "204":
          description: No Content - The review was successfully deleted.
        "401":
          description: Unauthorized - The user could not be authenticated.
        "404":
          description: Not Found - The product or review could not be found.
      x-origin-method: public void com.intershop.sellside.rest.common.capi.resource.review.ReviewItemResource.deleteProductReviewByID()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.review.ReviewItemResource
      x-AuthorizationRule: "[]"
  /products/{productKey}/reviews:
    post:
      tags:
        - Rating and Review
      summary: Creates review for a product
      description: This operation creates a user review for a product. The user must be authenticated.
      operationId: addReview
      parameters:
        - name: productKey
          in: path
          description: The product SKU
          required: true
          schema:
            type: string
            description: The product SKU
            example: "10809311"
          example: "10809311"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReviewRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/NewReviewRO"
      responses:
        "201":
          description: Created - The review was successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/LinkRO"
        "400":
          description: Bad Request - At least one attribute is missing or invalid.
        "401":
          description: Unauthorized - The user could not be authenticated.
        "404":
          description: Not Found - The product could not be found.
        "422":
          description: Unprocessable Entity - The customer already created a review for this product.
      security:
        - bearerAuth: []
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.LinkRO com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource.addReview(com.intershop.sellside.rest.common.capi.resourceobject.NewReviewRO)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource
      x-AuthorizationRule: "[isAuthenticated[Organization]]"
  /products/{productKey}/reviews/{ReviewKey}:
    delete:
      tags:
        - Rating and Review
      summary: Deletes product review by ID
      description: This operation deletes a specific user review of a specific product. The review can only be deleted by the user who created it. The user must be authenticated.
      operationId: deleteProductReviewByIDDELETEReviews
      parameters:
        - name: productKey
          in: path
          description: The product SKU
          required: true
          schema:
            type: string
            description: The product SKU
            example: "10809311"
          example: "10809311"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
        - name: ReviewKey
          in: path
          description: The review ID
          required: true
          schema:
            type: string
            description: The review ID
            example: aUAKDgAFMa8AAAF2XvNMKHUM
          example: aUAKDgAFMa8AAAF2XvNMKHUM
          x-item-key: com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource
      responses:
        "204":
          description: No Content - The review was successfully deleted.
        "401":
          description: Unauthorized - The user could not be authenticated.
        "404":
          description: Not Found - The product or review could not be found.
      security:
        - bearerAuth: []
      x-origin-method: public void com.intershop.sellside.rest.common.capi.resource.review.ReviewItemResource.deleteProductReviewByID()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.review.ReviewItemResource
      x-AuthorizationRule: "[isAuthenticated[Organization]]"
  /categories/{categoriesKey}/products{spgid}/{productKey}/reviews/{ReviewKey}:
    get:
      tags:
        - Rating and Review
      summary: Returns product review by ID
      description: |-
        This operation returns a specific user review of a specific product.

        If the user is logged in and owns the review, the result is not cached.
      operationId: getProductReviewByIDGETReviews_1
      parameters:
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: products
        - name: categoriesKey
          in: path
          description: The category ID
          required: true
          schema:
            type: string
            description: The category ID
            example: "153"
          example: "153"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.category.CategoryListResource
        - name: productKey
          in: path
          description: The product SKU
          required: true
          schema:
            type: string
            description: The product SKU
            example: "10809311"
          example: "10809311"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
        - name: ReviewKey
          in: path
          description: The review ID
          required: true
          schema:
            type: string
            description: The review ID
            example: aUAKDgAFMa8AAAF2XvNMKHUM
          example: aUAKDgAFMa8AAAF2XvNMKHUM
          x-item-key: com.intershop.sellside.rest.common.capi.resource.review.ReviewListResource
      responses:
        "200":
          description: OK - The review with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ReviewRO"
        "401":
          description: Unauthorized - The user could not be authenticated.
        "404":
          description: Not found - The product or review could not be found.
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.ReviewRO com.intershop.sellside.rest.common.capi.resource.review.ReviewItemResource.getProductReviewByID()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.review.ReviewItemResource
      x-AuthorizationRule: "[isAnyUser]"
  /products{spgid}/{productKey}/reviews:
    get:
      tags:
        - Rating and Review
      summary: Returns reviews of a product
      description: |-
        This operation returns a list of all user reviews for a product.

        If the user is logged in and uses the query parameter `own=true`, the result is not cached.
      operationId: getProductReviewsGET
      parameters:
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: products
        - name: attrs
          in: query
          description: |-
            `attrs` can contain the following attribute names separated by comma:

            - `authorname`: Name of the author (firstname and lastname, showAuthorNameFlag)
            - `content`: Content of the review
            - `creationdate`: Creation date of the review
            - `rating`: Rating of the review (0..5)
            - `status`: Status of the review (NEW, APPROVED)
            - `title`: Title of the review
            - `localeid`: Locale ID of the review
            - `own`: Flag determining whether the review is owned by the requested user
          schema:
            type: string
            description: |-
              `attrs` can contain the following attribute names separated by comma:

              - `authorname`: Name of the author (firstname and lastname, showAuthorNameFlag)
              - `content`: Content of the review
              - `creationdate`: Creation date of the review
              - `rating`: Rating of the review (0..5)
              - `status`: Status of the review (NEW, APPROVED)
              - `title`: Title of the review
              - `localeid`: Locale ID of the review
              - `own`: Flag determining whether the review is owned by the requested user
            example: status,rating
          example: status,rating
        - name: own
          in: query
          description: Flag that determines whether the review list should contain only reviews owned by the requested user or only reviews from other authors. If the flag is omitted, all reviews are returned.
          schema:
            type: boolean
            description: Flag that determines whether the review list should contain only reviews owned by the requested user or only reviews from other authors. If the flag is omitted, all reviews are returned.
            example: false
          example: "false"
        - name: localespecific
          in: query
          description: Flag that determines whether the review list contains reviews for the requested locale only or all reviews regardless of locale
          schema:
            type: boolean
            description: Flag that determines whether the review list contains reviews for the requested locale only or all reviews regardless of locale
