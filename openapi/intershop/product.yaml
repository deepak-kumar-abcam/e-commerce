openapi: 3.0.1
info:
  title: Product & Category
  description: |-
    The Intershop Product & Category REST API contains resources for retrieving a wide range of product-related information as well as category information and product filters.

    ## Personalized Content

    The call can contain customer-segment specific details, e.g. prices.

    If the `spgid` parameter is not provided, the cached version of the call is returned. Use the `spgid` parameter to retrieve a customer-segment specific version.

    For authenticated REST calls, use the `spgid` parameter in the URL. Otherwise the request will be considered anonymous, even if authentication is provided in the header.

    Example: `/products;spgid=12345`

    Use the `/personalization` call to retrieve the spgid.

    ## Product Filters

    ### Using the Product Filters Endpoint

    The `/products` endpoint returns available products. The results can be filtered by search term and product filters.
    The `/categories/{categoryID}/products` endpoint returns available products for a specific category. The results can be filtered by search term, product filters and predefined product filters (via the productFilter query parameter).
    The `/productfilters` endpoint is used to fetch said filters and filter entries.
    The interaction between these endpoints is illustrated in the following sections:

    ### Selection of Filter Entry

    To start, fetch the available filters for a search term.

    **Example:** `/productfilters?searchTerm=camera` fetches filters which are applicable for products matching the search term "camera".

    The result list of the endpoint contains further filters that can be applied in addition to the current filters. They can be applied by using the URI provided in the `link` field.

    **Example:** `/productfilters?searchTerm=camera&Colour_of_product=Black` applies the filter `Colour_of_product=Black` to the current query.

    It is possible to select multiple entries for a filter. If an attribute is a multi-value, then combinations of these values are made available in the list of filter entries.

    **Example:** `/productfilters?searchTerm=camera&Colour_of_product=Black_or_Blue` adds `Blue` to the filter.

    It is also possible to deselect entries. If a filter entry is selected, its `link` field will provide a link to deselect this entry.
    **Example:** `/productfilters?searchTerm=camera&Colour_of_product=Blue`

    ### Retrieving Product Hits

    To fetch the products that match the given search term and selected filters, use the link provided in the `hits` field.
    The existing query parameters that apply to the product list endpoint may be added to this query.

    **Example:** `/categories/Cameras-Camcorders/products?searchTerm=camera&Colour_of_product=Black_or_Blue&amount=12` fetches a maximum of 12 products matching these filters in the Cameras-Camcorders category.

    ### Navigation

    The same filters can also be used when navigating through the category tree.

    **Example:** `/categories/Cameras-Camcorders/832/productfilters?productFilter=fallback_searchquerydefinition` fetches filters that are available in the respective subcategory.

    ## Product SKU

    If the product SKU uses special characters ("/", ":", ...), then it needs to be double [encoded](https://developer.mozilla.org/en-US/docs/Glossary/percent-encoding).

    The SKU in the links in the responses are also double encoded, so they may be directly used.

    **Example** 
    product: Using double encoding for ```a/b```, it becomes ```a%252Fb```.

    ## Changelog

    ### Version 1.12.0
    * Added support for category references to `/products` and `/productfilters` endpoints
    * Changed `categoriesKey` parameter documentation in several endpoints to reflect the new category reference support

    ### Version 1.11.0
    * Added parameter `supplierName` and `manufacturerSKU` to `ProductRO`

    ### Version 1.10.0
    * Added query parameter `omitProductCountPerCategory` to the GET categories/{categoriesKey} request

    ### Version 1.9.0
    * Changed the query parameter `offset` for the products list call. The offset is rounded down to the nearest multiple of `amount` to match a full page

    ### Version 1.8.0
    * Added this changelog
    * Added query parameter `omitProductCountPerCategory` to GET categories request
  version: 1.12.0
servers:
  - url: /INTERSHOP/rest/{serverGroup}/{siteName}/{appUrl}
    description: Intershop ICM Server
    variables:
      serverGroup:
        description: The server group
        enum:
          - BOS
          - JOB
          - WFS
        default: WFS
      siteName:
        description: The site name
        default: PHX-PHXUS-Site
      appUrl:
        description: The application URL identifier
        enum:
          - PheneomenexRest
          - "-"
        default: PheneomenexRest
tags:
  - name: Custom Product List
    description: Return the requested product details and the eligible promotion details for the same product
    x-origin-class: com.intershop.sellside.rest.common.capi.resource.DanaherCustomProductListResource
paths:
  "{loc}{cur}/products{spgid}/{productKey}":
    get:
      tags:
        - Product
      summary: Returns details of a product
      description: This operation retrieves information about a product, usually in order to render a product details page.
      operationId: getProductSingle
      parameters:
        - $ref: "#/components/parameters/loc"
        - $ref: "#/components/parameters/cur"
        - $ref: "#/components/parameters/spgid"
          x-matrixParamPath: products
        - name: attrs
          in: query
          description: |-
            Allows to retrieve specific data for the product. Can be combined with the `view` parameter.

            Available values are every field in the ProductRO class, as well as other attributes that may be set in the product.

            Multiple values can be combined using commas. Available values:

            - `attachments`
            - `attributeGroups`
            - `availability` (in stock status, according to Intershop Commerce Management)
            - `availableGiftMessages`
            - `availableGiftWraps`
            - `availableStock` (the quantity which is available for sale, according to the Inventory Service)
            - `availableWarranties`
            - `averageRating` (average user evaluation score)
            - `bundles`
            - `crosssells`
            - `currencyCode`
            - `customAttributes`
            - `defaultCategory`
            - `endOfLife`
            - `images`
            - `inStock` (in stock status, according to the Inventory Service)
            - `lastOrderDate`
            - `listPrice`
            - `longDescription` (maximal item description)
            - `manufacturer`
            - `manufacturerSKU`
            - `mastered` (true, if the product is a variation product)
            - `maxListPrice`
            - `maxOrderQuantity`
            - `maxSalePrice`
            - `minListPrice`
            - `minOrderQuantity`
            - `minSalePrice`
            - `packingUnit` (unit in which the product is sold)
            - `partOfRetailSet`
            - `price`
            - `productBundle`
            - `productMaster` (true, if the product is a variation master)
            - `productMasterSKU` (the sku of the variation master if the current product is a variation product)
            - `productName`
            - `productTypes`
            - `promotions` (applicable promotions)
            - `readyForShipmentMax`
            - `readyForShipmentMin`
            - `retailSet`
            - `reviews`
            - `roundedAverageRating` (rating)
            - `salePrice`
            - `seoAttributes` (Search Engine Optimization attributes)
            - `shippingMethods`
            - `shortDescription` (minimal item description)
            - `sku` (product ID)
            - `stepOrderQuantity`
            - `summedUpListPrice`
            - `summedUpSalePrice`
            - `supplier`
            - `supplierSKU`
            - `timeToDelivery` (applicable shipping methods estimated delivery time in business days)
            - `variations`
            - `variationAttributeValues`
            - `variableVariationAttributes`
          schema:
            type: string
            description: |-
              Allows to retrieve specific data for the product. Can be combined with the `view` parameter.

              Available values are every field in the ProductRO class, as well as other attributes that may be set in the product.

              Multiple values can be combined using commas. Available values:

              - `attachments`
              - `attributeGroups`
              - `availability` (in stock status, according to Intershop Commerce Management)
              - `availableGiftMessages`
              - `availableGiftWraps`
              - `availableStock` (the quantity which is available for sale, according to the Inventory Service)
              - `availableWarranties`
              - `averageRating` (average user evaluation score)
              - `bundles`
              - `crosssells`
              - `currencyCode`
              - `customAttributes`
              - `defaultCategory`
              - `endOfLife`
              - `images`
              - `inStock` (in stock status, according to the Inventory Service)
              - `lastOrderDate`
              - `listPrice`
              - `longDescription` (maximal item description)
              - `manufacturer`
              - `manufacturerSKU`
              - `mastered` (true, if the product is a variation product)
              - `maxListPrice`
              - `maxOrderQuantity`
              - `maxSalePrice`
              - `minListPrice`
              - `minOrderQuantity`
              - `minSalePrice`
              - `packingUnit` (unit in which the product is sold)
              - `partOfRetailSet`
              - `price`
              - `productBundle`
              - `productMaster` (true, if the product is a variation master)
              - `productMasterSKU` (the sku of the variation master if the current product is a variation product)
              - `productName`
              - `productTypes`
              - `promotions` (applicable promotions)
              - `readyForShipmentMax`
              - `readyForShipmentMin`
              - `retailSet`
              - `reviews`
              - `roundedAverageRating` (rating)
              - `salePrice`
              - `seoAttributes` (Search Engine Optimization attributes)
              - `shippingMethods`
              - `shortDescription` (minimal item description)
              - `sku` (product ID)
              - `stepOrderQuantity`
              - `summedUpListPrice`
              - `summedUpSalePrice`
              - `supplier`
              - `supplierSKU`
              - `timeToDelivery` (applicable shipping methods estimated delivery time in business days)
              - `variations`
              - `variationAttributeValues`
              - `variableVariationAttributes`
            example: sku,inStock,manufacturer
          example: sku,inStock,manufacturer
        - name: view
          in: query
          description: |-
            ID of a custom view.

            It is possible to define custom views for the product stubs (i.e., which attributes shall be returned, instead of listing them all individually in the `attrs` parameter.) This can be done in a *WebshopREST.properties* file on domain level.

            Can be combined with the `attrs` parameter.
          schema:
            type: string
            description: |-
              ID of a custom view.

              It is possible to define custom views for the product stubs (i.e., which attributes shall be returned, instead of listing them all individually in the `attrs` parameter.) This can be done in a *WebshopREST.properties* file on domain level.

              Can be combined with the `attrs` parameter.
            example: default
            default: default
          example: default
        - name: imageView
          in: query
          description: |-
            By default, the response contains images of all image views that are maintained for this product. To receive only images of a specific image view, provide an image view ID. The possible values depend on the image management configuration in Intershop Commerce Management.

            Only one value allowed.
          schema:
            type: string
            description: |-
              By default, the response contains images of all image views that are maintained for this product. To receive only images of a specific image view, provide an image view ID. The possible values depend on the image management configuration in Intershop Commerce Management.

              Only one value allowed.
            example: front
          example: front
        - name: imageType
          in: query
          description: |-
            By default, the response contains images of all image types that are maintained for this product. Use this parameter to receive only images of a specific image type.

            Only one value allowed.
          schema:
            type: string
            description: |-
              By default, the response contains images of all image types that are maintained for this product. Use this parameter to receive only images of a specific image type.

              Only one value allowed.
            example: 2XS
          example: 2XS
        - name: allImages
          in: query
          description: Specify whether the response should contain all or no images.
          schema:
            type: string
            description: Specify whether the response should contain all or no images.
            example: "true"
            default: "false"
          example: "true"
        - name: basketId
          in: query
          description: ID of a specific basket. Allows to retrieve prices based on country-specific taxes for the given basket.
          schema:
            type: string
            description: ID of a specific basket. Allows to retrieve prices based on country-specific taxes for the given basket.
            example: 3CwKDgAFvUgAAAF3PScz6KVy
          example: 3CwKDgAFvUgAAAF3PScz6KVy
        - name: invoiceToAddressId
          in: query
          description: ID of a specific invoice address. Allows to retrieve prices based on country-specific taxes for the given invoice address.
          schema:
            type: string
            description: ID of a specific invoice address. Allows to retrieve prices based on country-specific taxes for the given invoice address.
            example: QdasEQAFJKAAAAF3o89ZTnFf
          example: QdasEQAFJKAAAAF3o89ZTnFf
        - name: shipToAddressId
          in: query
          description: ID of a specific shipping address. Allows to retrieve prices based on country-specific taxes for the given shipping address.
          schema:
            type: string
            description: ID of a specific shipping address. Allows to retrieve prices based on country-specific taxes for the given shipping address.
            example: QdasEQAFJKAAAAF3o89ZTnFf
          example: QdasEQAFJKAAAAF3o89ZTnFf
        - name: shipFromAddressId
          in: query
          description: ID of a specific sender address. Allows to retrieve prices based on country-specific taxes for the given sender address.
          schema:
            type: string
            description: ID of a specific sender address. Allows to retrieve prices based on country-specific taxes for the given sender address.
            example: SX6sEQAFMaYAAAF33DhZTnFf
          example: SX6sEQAFMaYAAAF33DhZTnFf
        - name: extended
          in: query
          description: Set to `true` to fetch extended information on product variations
          schema:
            type: boolean
            description: Set to `true` to fetch extended information on product variations
            example: false
            default: false
          example: "false"
        - name: productKey
          in: path
          description: The product ID
          required: true
          schema:
            type: string
            description: The product ID
            example: "10666802"
          example: "10666802"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
      responses:
        "200":
          description: OK - The product with the given ID is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ProductRO"
        "404":
          description: Not found - The product could not be found.
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.ProductRO com.intershop.sellside.rest.common.capi.resource.ProductResource.getProduct(java.lang.String,java.lang.String,java.lang.String,java.lang.String,java.lang.String,java.lang.String,java.lang.String,java.lang.String,java.lang.String,boolean)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.ProductResource
      x-AuthorizationRule: "[isAnyUser]"
  "{loc}{cur}/products{spgid}/{productKey}/categories":
    get:
      tags:
        - Product
        - Categories
      summary: Returns categories of a product
      description: This operation returns a list of all categories to which the product is explicitly or dynamically assigned.
      operationId: getCategoriesResource
      parameters:
