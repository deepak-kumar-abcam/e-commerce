      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.sellside.rest.common.capi.resource.ProductResource.getCategories()
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.ProductResource
      x-AuthorizationRule: "[isAnyUser]"
  "{loc}{cur}/products/{productKey}/variations/search":
    post:
      tags:
        - Product
      summary: Returns a variation of a product by search
      description: This operation returns a product variation for a product by searching for product attributes.
      operationId: searchVariationsPOST
      parameters:
        - $ref: "#/components/parameters/loc"
        - $ref: "#/components/parameters/cur"
        - name: productKey
          in: path
          description: The product ID
          required: true
          schema:
            type: string
            description: The product ID
            example: "10666802"
          example: "10666802"
          x-item-key: com.intershop.sellside.rest.common.capi.resource.ProductListResource
      requestBody:
        description: The request body that contains the product attributes to search for.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchAttributesRO"
          text/xml:
            schema:
              $ref: "#/components/schemas/ProductSearchAttributesRO"
      responses:
        "200":
          description: OK - The product variation is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRO"
            text/xml:
              schema:
                $ref: "#/components/schemas/ProductRO"
        "400":
          description: Bad request - The product is not a product master.
      x-origin-method: public com.intershop.sellside.rest.common.capi.resourceobject.ProductRO com.intershop.sellside.rest.common.capi.resource.product.VariationResource.searchVariations(jakarta.ws.rs.core.UriInfo,com.intershop.sellside.rest.common.capi.resourceobject.ProductSearchAttributesRO)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.product.VariationResource
      x-AuthorizationRule: "[isAnyUser]"
  "{loc}{cur}/productfilters":
    get:
      tags:
        - Filter
      summary: Returns product filters
      description: |-
        This operation retrieves a list of product filters.

        # Advanced Variation Handling

        This resource can be filtered by search index attributes (if specified in the back office).
        However, if you filter specifically by MasterSKU, there is a slightly different behavior: When you pass this parameter, you only get filters for variation attributes instead of all filters. The filter values count represents the number of available variations with that filter value.

        Example: ```/productfilters?MasterSKU=M123``` will exclude filters like *price* or *category* to show variation attributes only. 
      operationId: getProductFilters
      parameters:
        - $ref: "#/components/parameters/loc"
        - $ref: "#/components/parameters/cur"
        - name: searchTerm
          in: query
          description: An optional search term
          schema:
            type: string
            description: An optional search term
        - name: productFilter
          in: query
          description: A product filter ID to be used for category navigation or search respectively
          schema:
            type: string
            description: A product filter ID to be used for category navigation or search respectively
            example: sort_by_price
          example: sort_by_price
      responses:
        "200":
          description: OK - The list of product filters is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollectionROFilterRO"
        "404":
          description: Not found - No product filter could be found.
        "503":
          description: Service unavailable
      x-origin-method: public com.intershop.component.rest.capi.resourceobject.ResourceCollectionRO com.intershop.sellside.rest.common.capi.resource.ProductFiltersResource.getProductFilters(java.lang.String,java.lang.String)
      x-origin-class: com.intershop.sellside.rest.common.capi.resource.ProductFiltersResource
      x-AuthorizationRule: "[isAnyUser]"
